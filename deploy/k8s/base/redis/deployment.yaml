apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          args:
            - redis-server
            - --appendonly
            - 'yes'
            - --port
            - '6379'
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: '25m'
              memory: '64Mi'
            limits:
              cpu: '150m'
              memory: '192Mi'
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
