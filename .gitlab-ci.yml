stages:
  - build
  - deploy

variables:
  KUBE_NAMESPACE: tamagotchi-prod

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -f backend/Dockerfile -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA

build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -f frontend/Dockerfile -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA

deploy-production:
  stage: deploy
  image: line/kubectl-kustomize
  script:
    - cp "$KUBE_CONFIG" kubeconfig.yaml
    - export KUBECONFIG=$PWD/kubeconfig.yaml
    - cp "$ENV_PRODUCTION" manifests/overlay/prod/.env.production
    - cp "$ENV_SECRET" manifests/overlay/prod/.env.secret
    - kubectl get nodes
    - kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create secret docker-registry gitlab-registry --docker-server="$CI_REGISTRY" --docker-username="$CI_REGISTRY_USER" --docker-password="$CI_REGISTRY_PASSWORD" -n "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - cd manifests/overlay/prod
    - kustomize edit set image backend=$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - kustomize edit set image frontend=$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - kubectl apply -k . -n "$KUBE_NAMESPACE"
