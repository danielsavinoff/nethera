  redis:
    image: redis:7
    container_name: ${REDIS_HOST}
    command: --port ${REDIS_PORT}
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    networks:
      - internal-net

volumes:
  postgres_data:
  redis_data:
  cloudpub_config:

networks:
  internal-net:
    driver: bridge
