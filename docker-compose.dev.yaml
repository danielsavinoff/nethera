services:
  postgres:
    image: postgres:15
    container_name: ${DATABASE_HOST}
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE}
    command: ["postgres", "-c", "port=${DATABASE_PORT}"]
    ports:
      - ${DATABASE_EXPOSED_PORT}:${DATABASE_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-net

  backend:
    image: gamefication-backend:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: dev
    container_name: backend
    depends_on:
      postgres:
        condition: service_started
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    command: sh -c "npx prisma migrate dev && npx prisma db seed && npm run start:dev"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - internal-net

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: dev
    container_name: ${FRONTEND_HOST}
    depends_on:
      - backend
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}
    env_file:
      - .env
    command: npm run dev
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - internal-net

volumes:
  postgres_data:

networks:
  internal-net:
    driver: bridge
