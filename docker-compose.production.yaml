services:
  postgres:
    image: postgres:15
    container_name: ${DATABASE_HOST}
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE}
    command: ["postgres", "-c", "port=${DATABASE_PORT}"]
    ports:
      - ${DATABASE_EXPOSED_PORT}:${DATABASE_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-net

  backend:
    image: nethera-backend:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: prod
    container_name: backend
    depends_on:
      postgres:
        condition: service_started
    expose:
      - ${BACKEND_PORT}
    env_file:
      - .env
    networks:
      - internal-net

  frontend:
    image: nethera-frontend:latest
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ${FRONTEND_HOST}
    depends_on:
      backend:
        condition: service_started
    ports:
      - 80:80
      - 443:443
    env_file:
      - .env
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal-net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal-net:
    driver: bridge
