apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: frontend
          image: frontend
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-env
            - secretRef:
                name: app-env-secret
          command:
            - node
            - .output/server/index.mjs
          ports:
            - containerPort: 4000
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "75m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
